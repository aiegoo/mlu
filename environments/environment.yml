name: mlu
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8  # Remove this line for CPU-only
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - jupyter
  - jupyterlab
  - ipywidgets
  - notebook
  - pip
  - pip:
    - d2l>=1.0.3
    - tensorboard
    - transformers
    - datasets
    - nltk
    - spacy
    - plotly
    - tqdm
    - black
    - flake8
    - pytest